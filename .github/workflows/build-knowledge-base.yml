name: Build PPT knowledge base
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Hosted smoke test or private production
        type: choice
        options: [smoke, production]
        default: smoke
      target:
        description: Qualified additions counted in run.json (1–3400)
        type: number
        default: 832
concurrency:
  group: ppt-knowledge-base
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  smoke:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'smoke'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test batching, quota and recovery against isolated remote
        run: python3 新增资源/tools/controller/workflow_smoke.py
  production:
    if: github.ref == 'refs/heads/main' && inputs.mode == 'production'
    runs-on: [self-hosted, ppt-kb-private]
    timeout-minutes: 120
    steps:
      - name: Resume production on persistent checkout
        shell: bash
        env:
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          target="$REQUESTED_TARGET"
          if ! [[ "$target" =~ ^[0-9]+$ ]] || [ "$target" -lt 1 ] || [ "$target" -gt 3400 ]; then
            echo "Target must be 1-3400" >&2; exit 1
          fi
          root="${PPT_KB_HOME:?PPT_KB_HOME must point to the private persistent data directory}"
          py="$(command -v python3 || command -v python)"
          repo="$root/toolbox"
          args=(--repo "$repo" --baseline "$root/index.sqlite" --plan "$root/plan.json" --state "$root/run.json" --target "$target")
          [ -f "$root/approvals.json" ] && args+=(--approvals "$root/approvals.json")
          # Exit 3 means a clean run that ran out of approved candidates before the target.
          "$py" "$repo/新增资源/tools/controller/run_knowledge_base_batch.py" "${args[@]}"
